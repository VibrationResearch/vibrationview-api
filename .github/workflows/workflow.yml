name: Python Package CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov build twine
        python -m pip install -e .[dev]
    - name: Test with pytest
      run: |
        pytest tests/ --cov=vibrationviewapi --cov-report=xml -v
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  mypy:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]
    - name: Run mypy
      run: |
        mypy src/vibrationviewapi/

  check-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned dependencies
      run: |
        python -m pip install --upgrade pip
        grep -hv pywin32 requirements.txt requirements-dev.txt | grep '==' | pip install -r /dev/stdin
    - name: Check for outdated packages
      run: |
        outdated=$(pip list --outdated --format=columns 2>/dev/null || true)
        if [ -n "$outdated" ]; then
          echo "::warning::Outdated pinned dependencies found"
          echo "$outdated"
        else
          echo "All pinned dependencies are up to date."
        fi

  build-and-publish:
    needs: [test, mypy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/vibrationview-api
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set version from tag
      run: |
        VERSION=${GITHUB_REF_NAME}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "__version__ = \"$VERSION\"" > src/vibrationviewapi/_version.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --title "v$GITHUB_REF_NAME" \
          --generate-notes
